name: TDFuture codec and conversion
on:
  push:
    branches: [master, 'feature/tdfuture-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build unchanged classic renderer
        run: make
      - name: Core standard-library suite
        run: make test
      - name: Install optional raster dependencies
        run: python -m pip install Pillow fontTools
      - name: Optional raster suite
        run: make test
      - name: Check installed companion without installing fonts
        run: |
          make install-tdfx PREFIX="$RUNNER_TEMP/tdfx-install"
          "$RUNNER_TEMP/tdfx-install/bin/tdfx" --help
